name: Publish NGINX Mainline

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-nginx-mainline
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve NGINX version and tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nginx.outputs.version }}
      image: ${{ steps.nginx.outputs.image }}
      tags: ${{ steps.nginx.outputs.tags }}
    steps:
      - name: Resolve latest Mainline release and image tags
        id: nginx
        shell: bash
        run: |
          page=$(curl -fsSL --retry 3 https://nginx.org/en/download.html)
          heading='<h4>Mainline version</h4>'
          source_pattern='href="/download/nginx-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz"'
          mainline=${page#*"$heading"}
          if [[ $mainline == "$page" ]]; then
            echo '::error::Mainline section not found on the NGINX download page'
            exit 1
          fi
          mainline=${mainline%%<h4>*}
          mainline=${mainline%%</table>*}
          if [[ ! $mainline =~ $source_pattern ]]; then
            echo '::error::Mainline source archive not found on the NGINX download page'
            exit 1
          fi

          version=${BASH_REMATCH[1]}
          minor=${version%.*}
          major=${version%%.*}
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository"

          {
            echo "version=$version"
            echo "image=$image"
            echo 'tags<<NGINX_TAGS'
            for tag in "$version-alpine" "$minor-alpine" "$major-alpine" mainline-alpine alpine; do
              printf '%s:%s\n' "$image" "$tag"
            done
            echo 'NGINX_TAGS'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build linux/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      amd64: ${{ matrix.arch == 'amd64' && steps.image.outputs.digest || '' }}
      arm64: ${{ matrix.arch == 'arm64' && steps.image.outputs.digest || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: NGINX_SOURCE_VERSION=${{ needs.prepare.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          pull: true

  publish:
    name: Publish multi-platform image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tags for both architectures
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          AMD64_DIGEST: ${{ needs.build.outputs.amd64 }}
          ARM64_DIGEST: ${{ needs.build.outputs.arm64 }}
        run: |
          for digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo '::error::Both architecture image digests are required for publication'
              exit 1
            fi
          done

          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${tag_args[@]}" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
