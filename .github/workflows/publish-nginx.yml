name: Publish NGINX Mainline

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-nginx-mainline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve latest Mainline release and image tags
        id: nginx
        shell: bash
        run: |
          page=$(curl -fsSL --retry 3 https://nginx.org/en/download.html)
          heading='<h4>Mainline version</h4>'
          source_pattern='href="/download/nginx-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz"'
          mainline=${page#*"$heading"}
          if [[ $mainline == "$page" ]]; then
            echo '::error::Mainline section not found on the NGINX download page'
            exit 1
          fi
          mainline=${mainline%%<h4>*}
          mainline=${mainline%%</table>*}
          if [[ ! $mainline =~ $source_pattern ]]; then
            echo '::error::Mainline source archive not found on the NGINX download page'
            exit 1
          fi

          version=${BASH_REMATCH[1]}
          minor=${version%.*}
          major=${version%%.*}
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository"

          {
            echo "version=$version"
            echo 'tags<<NGINX_TAGS'
            for tag in "$version-alpine" "$minor-alpine" "$major-alpine" mainline-alpine alpine; do
              printf '%s:%s\n' "$image" "$tag"
            done
            echo 'NGINX_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: NGINX_SOURCE_VERSION=${{ steps.nginx.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.nginx.outputs.tags }}
          pull: true
          push: true
